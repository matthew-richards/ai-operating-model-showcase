<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#333"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7a3db8"/></marker>
</defs>
<rect width="1200" height="860" rx="24" fill="#fff"/>
<text x="600" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">How Jarvis works: one voice turn</text>
<!-- zones -->
<rect x="20" y="60" width="250" height="560" rx="12" fill="#eef5ff" stroke="#4a7bd0" stroke-dasharray="6 4"/>
<text x="145" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5aa8">On me</text>
<rect x="290" y="60" width="250" height="560" rx="12" fill="#fff6e8" stroke="#e08a1e" stroke-dasharray="6 4"/>
<text x="415" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#b06a10">Internet edge</text>
<rect x="560" y="60" width="620" height="560" rx="12" fill="#eefaf0" stroke="#2f9a4a" stroke-dasharray="6 4"/>
<text x="870" y="84" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f7a36">My own hardware (no inbound ports)</text>
<!-- glasses -->
<rect x="40" y="110" width="210" height="190" rx="10" fill="#fff" stroke="#4a7bd0" stroke-width="2"/>
<text x="145" y="136" text-anchor="middle" font-size="16" font-weight="bold">Rokid Glasses (stock)</text>
<text x="60" y="166" font-size="14">• Microphones (voice in)</text>
<text x="60" y="190" font-size="14">• Camera</text>
<text x="60" y="214" font-size="14">• Display (HUD)</text>
<text x="60" y="238" font-size="14">• Speaker</text>
<text x="60" y="270" font-size="13" fill="#555">"Hi Rokid, open Jarvis"</text>
<!-- STT -->
<rect x="310" y="110" width="210" height="110" rx="10" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
<text x="415" y="136" text-anchor="middle" font-size="16" font-weight="bold">Speech-to-text</text>
<text x="415" y="160" text-anchor="middle" font-size="13">Rokid platform</text>
<text x="415" y="180" text-anchor="middle" font-size="13">+ custom-agent callback</text>
<text x="415" y="204" text-anchor="middle" font-size="12" fill="#7a3db8">swappable stage</text>
<!-- Cloudflare -->
<rect x="310" y="270" width="210" height="150" rx="10" fill="#fff" stroke="#e08a1e" stroke-width="2"/>
<text x="415" y="296" text-anchor="middle" font-size="16" font-weight="bold">Cloudflare edge</text>
<text x="325" y="322" font-size="13">• Web app firewall</text>
<text x="325" y="344" font-size="13">• Access: authenticates</text>
<text x="337" y="362" font-size="13">the caller</text>
<text x="325" y="384" font-size="13">• Swappable front door</text>
<!-- tunnel -->
<rect x="580" y="290" width="180" height="110" rx="10" fill="#fff" stroke="#2f9a4a" stroke-width="2"/>
<text x="670" y="316" text-anchor="middle" font-size="16" font-weight="bold">Cloudflare Tunnel</text>
<text x="670" y="340" text-anchor="middle" font-size="13">connector dials OUT</text>
<text x="670" y="360" text-anchor="middle" font-size="13">nothing listens on</text>
<text x="670" y="378" text-anchor="middle" font-size="13">the internet</text>
<!-- bridge -->
<rect x="800" y="110" width="200" height="150" rx="10" fill="#fff" stroke="#2f9a4a" stroke-width="2"/>
<text x="900" y="136" text-anchor="middle" font-size="16" font-weight="bold">Jarvis bridge</text>
<text x="900" y="158" text-anchor="middle" font-size="13">(container)</text>
<text x="815" y="184" font-size="13">• App-level auth + allowlist</text>
<text x="815" y="206" font-size="13">• Rokid protocol ↔</text>
<text x="827" y="224" font-size="13">OpenAI-compatible API</text>
<text x="815" y="246" font-size="13">• Streams the answer back</text>
<!-- routing -->
<rect x="800" y="300" width="200" height="120" rx="10" fill="#fff" stroke="#2f9a4a" stroke-width="2"/>
<text x="900" y="326" text-anchor="middle" font-size="16" font-weight="bold">Model routing</text>
<text x="815" y="352" font-size="13">• Local first: Ollama</text>
<text x="827" y="370" font-size="13">on my own GPU</text>
<text x="815" y="394" font-size="13">• Hosted cloud models</text>
<text x="827" y="412" font-size="13">when needed</text>
<!-- sandbox -->
<rect x="800" y="460" width="200" height="120" rx="10" fill="#fff" stroke="#2f9a4a" stroke-width="2"/>
<text x="900" y="486" text-anchor="middle" font-size="16" font-weight="bold">Tools &amp; actions</text>
<text x="900" y="508" text-anchor="middle" font-size="13">container sandbox</text>
<text x="815" y="532" font-size="13">• Outbound blocked by default</text>
<text x="815" y="552" font-size="13">• Per-program network rules</text>
<text x="815" y="572" font-size="13">• Audit trail (evaluated)</text>
<!-- memory -->
<rect x="1020" y="110" width="145" height="150" rx="10" fill="#fff" stroke="#2f9a4a" stroke-width="2"/>
<text x="1092" y="136" text-anchor="middle" font-size="16" font-weight="bold">Memory</text>
<text x="1092" y="156" text-anchor="middle" font-size="16" font-weight="bold">&amp; notes</text>
<text x="1092" y="184" text-anchor="middle" font-size="13">Jarvis memory</text>
<text x="1092" y="206" text-anchor="middle" font-size="13">Notes vault,</text>
<text x="1092" y="224" text-anchor="middle" font-size="13">synced on a</text>
<text x="1092" y="242" text-anchor="middle" font-size="13">schedule</text>
<!-- watchdog -->
<rect x="1020" y="460" width="145" height="120" rx="10" fill="#f6efff" stroke="#7a3db8" stroke-width="2"/>
<text x="1092" y="486" text-anchor="middle" font-size="15" font-weight="bold">Watchdog</text>
<text x="1092" y="508" text-anchor="middle" font-size="12">runs OUTSIDE the core</text>
<text x="1092" y="530" text-anchor="middle" font-size="12">restarts only after</text>
<text x="1092" y="548" text-anchor="middle" font-size="12">repeated failures,</text>
<text x="1092" y="566" text-anchor="middle" font-size="12">with a cooldown</text>
<!-- spending cap -->
<rect x="1020" y="300" width="145" height="120" rx="10" fill="#f6efff" stroke="#7a3db8" stroke-width="2"/>
<text x="1092" y="326" text-anchor="middle" font-size="15" font-weight="bold">Spending cap</text>
<text x="1092" y="350" text-anchor="middle" font-size="12">hard limit on cloud</text>
<text x="1092" y="368" text-anchor="middle" font-size="12">model use; heavy jobs</text>
<text x="1092" y="386" text-anchor="middle" font-size="12">check budget first</text>
<!-- role rules -->
<rect x="580" y="460" width="180" height="120" rx="10" fill="#f6efff" stroke="#7a3db8" stroke-width="2"/>
<text x="670" y="486" text-anchor="middle" font-size="15" font-weight="bold">Role rules</text>
<text x="670" y="510" text-anchor="middle" font-size="12">written scope for Jarvis;</text>
<text x="670" y="530" text-anchor="middle" font-size="12">mistakes → blameless</text>
<text x="670" y="550" text-anchor="middle" font-size="12">report → new rule</text>
<!-- eval + github bottom -->
<rect x="20" y="640" width="560" height="120" rx="12" fill="#fffbe6" stroke="#c9a400" stroke-width="2"/>
<text x="300" y="666" text-anchor="middle" font-size="16" font-weight="bold">Evaluation loop: accuracy &amp; speed</text>
<text x="40" y="692" font-size="13">• Weekly sweep: same tests across hosted + local models; flags drift</text>
<text x="40" y="714" font-size="13">• Speech-to-text: real-world voice from the glasses; Rokid platform</text>
<text x="52" y="734" font-size="13">vs. local whisper.cpp is a candidate comparison</text>
<text x="40" y="754" font-size="13">• Results feed back into which model gets used</text>
<rect x="620" y="640" width="560" height="120" rx="12" fill="#f3f3f3" stroke="#555" stroke-width="2"/>
<text x="900" y="666" text-anchor="middle" font-size="16" font-weight="bold">GitHub: where code and docs live</text>
<text x="640" y="692" font-size="13">• Bridge code, runbooks, design and decision records</text>
<text x="640" y="714" font-size="13">• Pull requests with automated checks</text>
<text x="640" y="736" font-size="13">• Project board tracks the work</text>
<!-- arrows -->
<g stroke="#333" stroke-width="2" fill="none" font-size="12">
<path d="M250,165 L308,165" marker-end="url(#a)"/>
<path d="M415,220 L415,268" marker-end="url(#a)"/>
<path d="M520,345 L578,345" marker-end="url(#a)"/>
<path d="M760,320 L780,320 L780,185 L798,185" marker-end="url(#a)"/>
<path d="M900,260 L900,298" marker-end="url(#a)"/>
<path d="M900,420 L900,458" marker-end="url(#a)"/>
<path d="M1000,170 L1018,170" marker-end="url(#a)"/>
<path d="M800,258 L250,258" stroke-dasharray="5 4" marker-end="url(#a)"/>
</g>
<g font-size="12" fill="#333">
<text x="255" y="157">1 voice</text>
<text x="422" y="240">2 transcript</text>
<text x="524" y="337">3 via</text>
<text x="784" y="300">4 forwarded</text>
<text x="906" y="284">5 prompt</text>
<text x="906" y="444">6 tool call</text>
<text x="545" y="274">7 streamed answer</text>
</g>
<g stroke="#7a3db8" stroke-width="2" fill="none" stroke-dasharray="3 3">
<path d="M1020,360 L1002,360" marker-end="url(#g)"/>
<path d="M1165,520 L1172,520 L1172,280 L1002,280" marker-end="url(#g)"/>
<path d="M760,520 L798,520" marker-end="url(#g)"/>
<path d="M300,640 L300,600 L900,600 L900,582" marker-end="url(#g)"/>
</g>
<g font-size="11" fill="#7a3db8">
<text x="1040" y="276">restarts bridge</text>
<text x="766" y="512">scope</text>
<text x="560" y="595">measures models + STT</text>
</g>
<!-- legend -->
<g font-size="13">
<rect x="20" y="782" width="1160" height="64" rx="8" fill="#fafafa" stroke="#bbb"/>
<text x="36" y="806" font-weight="bold">Legend</text>
<line x1="100" y1="802" x2="140" y2="802" stroke="#333" stroke-width="2" marker-end="url(#a)"/><text x="148" y="806">request path (numbered)</text>
<line x1="320" y1="802" x2="360" y2="802" stroke="#333" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="368" y="806">response path</text>
<line x1="490" y1="802" x2="530" y2="802" stroke="#7a3db8" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#g)"/><text x="538" y="806">guardrail / evaluation acting on a stage</text>
<rect x="830" y="792" width="18" height="14" fill="#f6efff" stroke="#7a3db8"/><text x="854" y="806">guardrail</text>
<rect x="940" y="792" width="18" height="14" fill="#fffbe6" stroke="#c9a400"/><text x="964" y="806">evaluation</text>
<text x="36" y="832" fill="#555">Dashed zones show where each part runs. Specific hosts, addresses and configuration are intentionally left out.</text>
</g>
</svg>
