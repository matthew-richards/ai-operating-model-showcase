<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1066" viewBox="0 0 900 1066" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker></defs>
<rect width="900" height="1066" rx="24" fill="#FFFFFF"/>
<text x="48" y="70" font-size="34" font-weight="700" fill="#0F172A">How Jarvis works</text>
<text x="48" y="106" font-size="19" fill="#64748B">One voice turn, from wake phrase to answer</text>
<circle cx="86" cy="186" r="26" fill="#0F2A44"/><text x="86" y="194" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="136" y="136" width="716" height="100" rx="12" fill="#0F2A44" stroke="#0F2A44" stroke-width="1.5"/>
<text x="160" y="178" font-size="24" font-weight="700" fill="#FFFFFF">"Hi Rokid, open Jarvis"</text>
<text x="160" y="212" font-size="19" fill="#CBD5E1">I wake Jarvis on stock Rokid Glasses.</text>
<path d="M86,214 V256" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="312" r="26" fill="#0F2A44"/><text x="86" y="320" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="136" y="262" width="716" height="100" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="160" y="304" font-size="24" font-weight="700" fill="#0F172A">Speech to text</text>
<text x="160" y="338" font-size="19" fill="#475569">Rokid's platform turns my voice into text.</text>
<path d="M86,340 V382" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="438" r="26" fill="#0F2A44"/><text x="86" y="446" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="136" y="388" width="716" height="100" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="160" y="430" font-size="24" font-weight="700" fill="#064E3B">Cloudflare edge</text>
<text x="160" y="464" font-size="19" fill="#065F46">A web firewall and Access check the request.</text>
<path d="M86,466 V508" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="564" r="26" fill="#0F2A44"/><text x="86" y="572" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="136" y="514" width="716" height="100" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/>
<text x="160" y="556" font-size="24" font-weight="700" fill="#064E3B">Tunnel home</text>
<text x="160" y="590" font-size="19" fill="#065F46">An outbound-only tunnel; no open port at home.</text>
<path d="M86,592 V634" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="690" r="26" fill="#0F2A44"/><text x="86" y="698" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="136" y="640" width="716" height="100" rx="12" fill="#0F2A44" stroke="#0F2A44" stroke-width="1.5"/>
<text x="160" y="682" font-size="24" font-weight="700" fill="#FFFFFF">Jarvis bridge</text>
<text x="160" y="716" font-size="19" fill="#CBD5E1">Checks its own credentials, then translates.</text>
<path d="M86,718 V760" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="816" r="26" fill="#0F2A44"/><text x="86" y="824" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<rect x="136" y="766" width="716" height="100" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
<text x="160" y="808" font-size="24" font-weight="700" fill="#0F172A">Model routing</text>
<text x="160" y="842" font-size="19" fill="#475569">Local model on my GPU first, cloud if needed.</text>
<path d="M86,844 V886" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
<circle cx="86" cy="942" r="26" fill="#0F2A44"/><text x="86" y="950" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<rect x="136" y="892" width="716" height="100" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
<text x="160" y="934" font-size="24" font-weight="700" fill="#78350F">Answer streams back</text>
<text x="160" y="968" font-size="19" fill="#92400E">Display and speaker start before it's done.</text>
<text x="48" y="1032" font-size="17" fill="#475569">Passing the edge isn't enough: the app checks credentials and an allowlist too.</text>
</svg>
