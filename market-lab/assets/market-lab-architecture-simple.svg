<text x="660.0" y="346.0" font-size="20" fill="#0F172A" text-anchor="middle" font-weight="700">Watchdog</text>
<text x="660.0" y="372.0" font-size="15" fill="#475569" text-anchor="middle">restarts capture</text>
<line x1="660" y1="300" x2="660" y2="232" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="6 6"/>
<rect x="820" y="300" width="200" height="100" rx="16" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
<text x="920.0" y="346.0" font-size="20" fill="#0F172A" text-anchor="middle" font-weight="700">Rundowns</text>
<text x="920.0" y="372.0" font-size="15" fill="#475569" text-anchor="middle">summaries + charts</text>
<line x1="920" y1="230" x2="920" y2="298" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="1060" y="300" width="120" height="100" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/>
<text x="1120.0" y="346.0" font-size="20" fill="#0F172A" text-anchor="middle" font-weight="700">Me</text>
<text x="1120.0" y="372.0" font-size="15" fill="#475569" text-anchor="middle">review</text>
<line x1="1020" y1="350" x2="1058" y2="350" stroke="#64748B" stroke-width="2.5" marker-end="url(#a)"/>
<text x="600" y="450" font-size="16" fill="#475569" text-anchor="middle" font-style="italic">Raw data stays local. Only summaries and charts leave.</text>
