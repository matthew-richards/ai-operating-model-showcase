<text x="300.0" y="322.0" font-size="15" fill="#475569" text-anchor="middle">unchanged</text>
<rect x="480" y="250" width="240" height="100" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2" stroke-dasharray="8 6"/>
<text x="600.0" y="296.0" font-size="20" fill="#0F172A" text-anchor="middle" font-weight="700">Cloud storage</text>
<text x="600.0" y="322.0" font-size="15" fill="#475569" text-anchor="middle">AWS, not final</text>
