name: vale
on:
  pull_request:
permissions:
  contents: read
  checks: write
  pull-requests: read
jobs:
  vale:
    name: prose style (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@reviewdog
        with:
          files: '["."]'
          glob: '*.md'
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: false
